title = "sift secret scanning config"

# Extend (not replace) gitleaks' built-in default ruleset: all standard provider-key,
# generic-high-entropy, private-key, etc. rules keep running unmodified. This file only
# layers project-specific allowlist entries on top — see sift's CLAUDE.md: real
# credentials (NIM/Anthropic keys, DATABASE_URL) live only in the gitignored `.env`, never
# in source control.
[extend]
useDefault = true

# Placeholder env files ship with empty-value or dummy keys by convention (see
# .env.demo.example, .env.example) and are never real credentials. Matches any filename
# ending in `.example`, at any depth.
[[allowlists]]
description = "placeholder *.example env files (empty/dummy values by convention, never real credentials)"
paths = [
  '''(^|/)[^/]*\.example$''',
]

# Confirmed false positive (manual line-by-line audit, see
# docs/eval-reports/p5-secret-scan.md): generic-api-key fired on prose describing the
# bge-large-en-v1.5 embedding pipeline (mean-pooling/L2-normalize steps and the model's
# publicly documented query-instruction string, also implemented verbatim in
# core/src/embed/registry.ts) — quote/colon punctuation plus moderate entropy, not a
# credential. The full surrounding text was read directly from the file (not via gitleaks,
# to honor --redact-only) and contains no key, token, or password.
#
# Scoped tightly without echoing the flagged substring: condition = "AND" requires BOTH
# the path AND the single historical commit that introduced the prose (the only commit
# ever touching this file, per `git log --follow` / `git log -S`) to match. A secret
# pasted into this doc in any FUTURE commit is still detected — verified by negative test
# (fake AWS key appended to this file on a throwaway commit was caught with this
# allowlist active).
[[allowlists]]
description = "docs design-spec prose false-positive on generic-api-key (manually audited, no credential present; pinned to the introducing commit)"
condition = "AND"
commits = [
  "c3e33874586e137d63ab6cd068bacb36a27f943d",
]
paths = [
  '''^docs/superpowers/specs/2026-06-25-phase-1-naive-baseline-design\.md$''',
]
