[project]
name = "sift-pipeline"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "datasets>=2.18",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]
ml = [
  "torch>=2.2",
  "transformers>=4.44",
  "peft>=0.12",
  "datasets>=2.18",
  "sentencepiece>=0.2",
  "protobuf>=4.25",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
