services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sift
      POSTGRES_PASSWORD: sift
      POSTGRES_DB: sift
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sift -d sift"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - sift_pgdata:/var/lib/postgresql/data

volumes:
  sift_pgdata:
